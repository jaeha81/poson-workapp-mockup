<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>포스온 업무관리 — 화면 초안 (Mockup v1)</title>
<style>
:root{
  --navy:#1E3A5F; --navy-700:#16304f; --navy-100:#E8EDF3;
  --orange:#F97316; --orange-50:#FFF3E9;
  --green:#0E9F6E; --green-50:#E8F7F1;
  --red:#E02424;
  --bg:#F6F7F9; --card:#fff; --line:#E4E7EC;
  --t1:#101828; --t2:#475467; --t3:#98A2B3;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Pretendard',-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--t1); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}

/* ===== 레이아웃 ===== */
.app{display:flex;min-height:100vh}

/* ===== 사이드바 ===== */
.side{
  width:220px;flex-shrink:0;background:var(--navy);color:#fff;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh
}
.side .brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.side .brand b{display:block;font-size:17px;letter-spacing:-.3px}
.side .brand span{font-size:11px;color:#9DB3CC}
.nav{padding:12px 10px;flex:1;overflow-y:auto}
.nav-label{font-size:10px;color:#7E9AB8;padding:12px 10px 6px;letter-spacing:.5px}
.nav a{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;
  color:#D3DEEA;text-decoration:none;font-size:13.5px;margin-bottom:2px
}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:#fff;color:var(--navy);font-weight:600}
.nav a .ic{width:16px;text-align:center;font-size:14px}
.nav a .cnt{
  margin-left:auto;background:var(--orange);color:#fff;font-size:10.5px;
  font-weight:700;padding:1px 6px;border-radius:9px
}
.nav a.on .cnt{background:var(--orange)}
.side-foot{padding:12px 14px 16px;border-top:1px solid rgba(255,255,255,.12)}
.btn-new{
  width:100%;background:var(--orange);color:#fff;font-weight:700;font-size:14px;
  padding:11px;border-radius:9px
}
.btn-new:hover{background:#ea6a0c}

/* ===== 본문 ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  background:#fff;border-bottom:1px solid var(--line);padding:0 22px;height:58px;
  display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20
}
.top h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
.top .today{font-size:12.5px;color:var(--t3)}
.top .sp{flex:1}
.search{
  display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;width:240px
}
.search input{border:none;background:none;outline:none;width:100%;font-size:13px}
.bell{position:relative;font-size:17px;padding:6px}
.bell .dot{
  position:absolute;top:1px;right:0;background:var(--orange);color:#fff;font-size:9.5px;
  font-weight:700;min-width:15px;height:15px;line-height:15px;border-radius:8px;text-align:center
}
.me{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:5px 8px;border-radius:8px}
.me:hover{background:var(--bg)}
.av{
  width:27px;height:27px;border-radius:50%;background:var(--navy-100);color:var(--navy);
  font-size:11.5px;font-weight:700;display:grid;place-items:center
}
.body{padding:20px 22px 60px;max-width:1080px;width:100%}

/* ===== 필터탭 ===== */
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{
  padding:7px 13px;border-radius:20px;font-size:13px;color:var(--t2);
  background:#fff;border:1px solid var(--line);font-weight:500
}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.tab .n{opacity:.7;margin-left:4px;font-size:12px}

/* ===== 업무 카드 ===== */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 17px;margin-bottom:11px;transition:.12s
}
.card:hover{border-color:#C6D3E1;box-shadow:0 2px 10px rgba(16,24,40,.06)}
.card .r1{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.chip.urgent{background:#FDECEC;color:var(--red)}
.chip.doing{background:#FFF7E6;color:#B45309}
.chip.done{background:var(--green-50);color:var(--green)}
.store{font-size:13px;font-weight:700;color:var(--navy)}
.cat{font-size:11px;color:var(--t3);border:1px solid var(--line);padding:2px 7px;border-radius:5px}
.card h3{font-size:15.5px;font-weight:600;letter-spacing:-.2px;margin-bottom:6px}
.meta{font-size:12.5px;color:var(--t2);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.meta .to-me{color:var(--orange);font-weight:700}
.sep{color:var(--t3)}
.ackrow{
  display:flex;align-items:center;gap:10px;margin-top:11px;padding-top:11px;
  border-top:1px dashed var(--line);flex-wrap:wrap
}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:50%;background:#DDE2E8;display:block}
.dots i.f{background:var(--green)}
.ackn{font-size:12.5px;color:var(--t2);font-weight:600}
.unread{font-size:12px;color:var(--t3)}
.acts{margin-left:auto;display:flex;gap:6px}
.btn{
  font-size:12.5px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);
  background:#fff;font-weight:600;color:var(--t2)
}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:var(--navy-700)}
.btn.ok{background:var(--green-50);color:var(--green);border-color:#B7E4D2}
.btn.ok:hover{background:#dcf3ea}

/* ===== 상세 ===== */
.back{font-size:13px;color:var(--t2);margin-bottom:12px;display:inline-flex;gap:5px;align-items:center}
.back:hover{color:var(--navy)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
.panel h2{font-size:19px;font-weight:700;letter-spacing:-.4px;margin-bottom:8px}
.desc{color:var(--t2);font-size:14px;background:var(--bg);padding:12px 14px;border-radius:8px;margin:12px 0;white-space:pre-line}
.panel h4{font-size:13px;font-weight:700;color:var(--t2);margin-bottom:10px}
.bar{height:8px;background:#EDF0F3;border-radius:5px;overflow:hidden;margin:6px 0 14px}
.bar > i{display:block;height:100%;background:var(--green);border-radius:5px;transition:width .35s}
.plist{display:flex;flex-direction:column;gap:2px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #F2F4F7;font-size:13.5px}
.prow:last-child{border-bottom:none}
.prow .st{width:17px;text-align:center}
.prow .nm{font-weight:600;min-width:56px}
.prow .tm{color:var(--t3);font-size:12.5px}
.prow .note{color:var(--t2);font-size:12.5px;font-style:italic}
.prow .rm{margin-left:auto}
.btn.sm{font-size:11.5px;padding:4px 9px}
.cmt{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid #F2F4F7}
.cmt .av{width:30px;height:30px;flex-shrink:0}
.cmt .b b{font-size:13px}
.cmt .b time{font-size:11.5px;color:var(--t3);margin-left:6px}
.cmt .b p{font-size:13.5px;color:var(--t2);margin-top:2px}
.cmtform{display:flex;gap:8px;margin-top:14px}
.cmtform input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none}
.cmtform input:focus{border-color:var(--navy)}

/* ===== 모달 ===== */
.mask{
  position:fixed;inset:0;background:rgba(16,24,40,.45);display:none;
  place-items:center;z-index:60;padding:20px;overflow-y:auto
}
.mask.on{display:grid}
.modal{background:#fff;border-radius:14px;width:100%;max-width:540px;box-shadow:0 20px 50px rgba(16,24,40,.2)}
.mhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.mhead b{font-size:16.5px}
.mhead button{margin-left:auto;font-size:20px;color:var(--t3);line-height:1}
.mbody{padding:20px 22px;max-height:64vh;overflow-y:auto}
.f{margin-bottom:15px}
.f > label{display:block;font-size:12.5px;font-weight:700;color:var(--t2);margin-bottom:6px}
.f input[type=text],.f select,.f textarea,.f input[type=date],.f input[type=time]{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;outline:none;background:#fff
}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy)}
.f textarea{min-height:78px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{
  flex:1;min-width:78px;text-align:center;border:1px solid var(--line);border-radius:8px;
  padding:8px;font-size:13px;cursor:pointer;font-weight:500
}
.radios input{display:none}
.radios input:checked + span{color:var(--navy);font-weight:700}
.radios label:has(input:checked){border-color:var(--navy);background:var(--navy-100)}
.shareBox{border:1px solid var(--line);border-radius:9px;padding:13px;background:var(--bg)}
.shareBox .opt{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:8px;cursor:pointer}
.people{display:flex;gap:6px;flex-wrap:wrap;padding-left:24px;margin-bottom:6px}
.people label{
  border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 11px;
  font-size:12.5px;cursor:pointer
}
.people label:has(input:checked){background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
.people input{display:none}
.mfoot{padding:15px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.mfoot .btn{padding:9px 18px;font-size:13.5px}

/* ===== 알림 ===== */
.noti{
  position:absolute;top:52px;right:16px;width:320px;background:#fff;border:1px solid var(--line);
  border-radius:11px;box-shadow:0 12px 30px rgba(16,24,40,.14);display:none;z-index:50;overflow:hidden
}
.noti.on{display:block}
.noti .nh{padding:12px 15px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px}
.noti .ni{padding:11px 15px;border-bottom:1px solid #F2F4F7;font-size:13px;cursor:pointer;display:flex;gap:9px}
.noti .ni:hover{background:var(--bg)}
.noti .ni .em{font-size:15px}
.noti .ni b{font-weight:600}
.noti .ni time{display:block;color:var(--t3);font-size:11.5px;margin-top:2px}
.noti .ni.new{background:var(--orange-50)}

/* ===== 매뉴얼 ===== */
.mn{display:flex;gap:16px;align-items:flex-start}
.mn-side{
  width:190px;flex-shrink:0;background:#fff;border:1px solid var(--line);
  border-radius:var(--r);padding:9px;position:sticky;top:74px
}
.mn-side .t{font-size:11px;color:var(--t3);padding:5px 9px 8px;font-weight:700}
.mn-side a{
  display:flex;gap:8px;padding:7px 9px;border-radius:7px;text-decoration:none;
  color:var(--t2);font-size:13px
}
.mn-side a:hover{background:var(--bg)}
.mn-side a.on{background:var(--navy-100);color:var(--navy);font-weight:700}
.mn-side a .no{color:var(--t3);font-size:12px;min-width:15px}
.mn-side a.on .no{color:var(--navy)}
.mn-main{flex:1;min-width:0}
.viewer{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden
}
.vpage{
  background:#525659;padding:22px;display:grid;place-items:center;min-height:400px
}
.sheet{
  background:#fff;width:100%;max-width:520px;aspect-ratio:4/3;border-radius:3px;
  box-shadow:0 4px 16px rgba(0,0,0,.3);padding:26px 30px;display:flex;flex-direction:column
}
.sheet .st{font-size:15px;font-weight:700;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:7px}
.sheet .sl{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.sheet .sl i{display:block;height:8px;background:#EDF0F3;border-radius:3px}
.sheet .sl i:nth-child(2){width:88%} .sheet .sl i:nth-child(3){width:72%}
.sheet .sl i:nth-child(5){width:60%}
.sheet .simg{flex:1;margin-top:14px;background:#F2F4F7;border:1px dashed #D0D5DD;border-radius:5px;display:grid;place-items:center;color:var(--t3);font-size:12px}
.sheet .sf{margin-top:12px;font-size:10.5px;color:var(--t3);text-align:center}
.vbar{padding:11px 15px;display:flex;align-items:center;gap:9px;border-top:1px solid var(--line);flex-wrap:wrap}
.vbar .pg{font-size:13px;color:var(--t2);font-weight:600}
.vbar .sp{flex:1}
.mn-info{font-size:12px;color:var(--t3);margin-top:9px;padding:0 3px}

/* ===== 매뉴얼 학습형 ===== */
.mprog{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;margin-bottom:14px}
.mprog .r{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.mprog b{font-size:15px}
.mprog .pc{margin-left:auto;font-size:13px;color:var(--green);font-weight:700}
.msearch{
  display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:10px 13px;margin-bottom:14px
}
.msearch input{border:none;outline:none;width:100%;font-size:14px}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.chap{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;
  cursor:pointer;transition:.12s;text-align:left;width:100%
}
.chap:hover{border-color:var(--navy);box-shadow:0 2px 10px rgba(16,24,40,.07)}
.chap .h{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.chap .num{
  width:26px;height:26px;border-radius:7px;background:var(--navy-100);color:var(--navy);
  font-size:12.5px;font-weight:800;display:grid;place-items:center;flex-shrink:0
}
.chap.done .num{background:var(--green-50);color:var(--green)}
.chap .t{font-size:14.5px;font-weight:700}
.chap .s{font-size:12px;color:var(--t3);line-height:1.45;margin-bottom:10px}
.chap .b{height:5px;background:#EDF0F3;border-radius:3px;overflow:hidden}
.chap .b i{display:block;height:100%;background:var(--green)}
.chap .f{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;color:var(--t3)}
.chap .soonx{background:#F2F4F7;color:var(--t3);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px}

.sec{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  margin-bottom:9px;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;text-align:left
}
.sec:hover{border-color:var(--navy)}
.sec .ck{font-size:17px;flex-shrink:0}
.sec .t{font-size:14.5px;font-weight:600}
.sec .s{font-size:12.5px;color:var(--t3);margin-top:2px}
.sec .go{margin-left:auto;color:var(--t3);flex-shrink:0}

.lead{
  background:var(--navy);color:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:14px
}
.lead .k{font-size:11px;color:#9DB3CC;font-weight:700;margin-bottom:5px}
.lead p{font-size:15px;line-height:1.55}
.stepn{counter-reset:st;margin-bottom:14px}
.step{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 52px;
  margin-bottom:9px;position:relative
}
.step::before{
  counter-increment:st;content:counter(st);position:absolute;left:14px;top:13px;
  width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;
  font-size:12.5px;font-weight:800;display:grid;place-items:center
}
.step b{display:block;font-size:14.5px;margin-bottom:5px}
.step p{font-size:13.5px;color:var(--t2);white-space:pre-line;line-height:1.6}
.step .mk{
  display:inline-block;background:var(--orange-50);color:#B45309;font-size:11px;font-weight:700;
  padding:2px 8px;border-radius:5px;margin-top:7px
}
.shot{
  margin-top:9px;background:#F2F4F7;border:1px dashed #D0D5DD;border-radius:7px;
  padding:20px;text-align:center;color:var(--t3);font-size:12px
}
.note{border-radius:var(--r);padding:13px 15px;margin-bottom:11px;font-size:13.5px;line-height:1.6}
.note.w{background:#FEF3F2;border:1px solid #FDA29B;color:#B42318}
.note.i{background:#FFFAEB;border:1px solid #FEC84B;color:#B54708}
.note b{display:block;margin-bottom:4px}
.ktab{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border-radius:8px;overflow:hidden}
.ktab th{background:var(--navy);color:#fff;padding:9px 11px;text-align:left;font-size:12.5px}
.ktab td{padding:9px 11px;border-bottom:1px solid #F2F4F7;vertical-align:top}
.ktab td:first-child{font-weight:700;color:var(--navy);white-space:nowrap}
.ktab tr:last-child td{border-bottom:none}
.tabwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin-bottom:11px}

.quiz{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.quiz .q{font-size:14.5px;font-weight:600;margin-bottom:12px}
.quiz .ox{display:flex;gap:9px}
.quiz .ox button{
  flex:1;border:1px solid var(--line);border-radius:9px;padding:13px;font-size:16px;
  font-weight:800;background:#fff;color:var(--t2)
}
.quiz .ox button:hover{border-color:var(--navy);color:var(--navy)}
.quiz .res{margin-top:12px;font-size:13.5px;line-height:1.6;padding:12px 14px;border-radius:8px}
.quiz .res.ok{background:var(--green-50);color:#05603A}
.quiz .res.no{background:#FEF3F2;color:#B42318}
.donebar{display:flex;gap:9px;margin-bottom:20px}
.donebar .btn{flex:1;padding:13px;font-size:14px}

/* ===== 빈/안내 ===== */
.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:44px 20px;text-align:center}
.empty .em{font-size:32px;margin-bottom:10px}
.empty b{display:block;font-size:15px;margin-bottom:5px}
.empty p{color:var(--t2);font-size:13.5px}
.soon{display:inline-block;background:var(--orange-50);color:#B45309;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;margin-bottom:12px}
.drop{border:2px dashed #CBD5E1;border-radius:var(--r);padding:34px;text-align:center;background:#fff;margin-top:14px}
.drop .em{font-size:28px}
.drop b{display:block;margin:8px 0 4px;font-size:14.5px}
.drop p{color:var(--t3);font-size:12.5px}

/* ===== 토스트 ===== */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--t1);color:#fff;padding:12px 20px;border-radius:9px;font-size:13.5px;
  font-weight:500;opacity:0;transition:.25s;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25)
}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}

/* ===== 목업 배너 ===== */
.mockbar{
  background:#111827;color:#D1D5DB;font-size:11.5px;padding:6px 22px;
  display:flex;gap:10px;align-items:center;flex-wrap:wrap
}
.mockbar b{color:var(--orange)}

/* ===== 모바일 ===== */
.burger{display:none;font-size:19px;padding:5px}
@media (max-width:900px){
  .side{
    position:fixed;left:0;top:0;z-index:70;transform:translateX(-100%);transition:.22s;
    box-shadow:4px 0 24px rgba(0,0,0,.2)
  }
  .side.open{transform:none}
  .burger{display:block}
  .search{display:none}
  .body{padding:14px 13px 60px}
  .top{padding:0 13px;gap:9px}
  .top .today{display:none}
  .mn{flex-direction:column}

let cur = {view:'tasks', filter:'today', taskId:null, mchap:null, msec:null, mq:''};

/* ================= 유틸 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._x); t._x = setTimeout(()=>t.classList.remove('on'), 2200);
}
function ackTotal(t){ return t.targets.length; }
function ackDone(t){ return t.acks.length; }
function iAcked(t){ return t.acks.some(a => a.n === ME); }
function isTarget(t){ return t.targets.includes(ME); }
function unreadNames(t){ return t.targets.filter(n => !t.acks.some(a => a.n === n)); }

function chipOf(t){
  if(t.status==='done')  return '<span class="chip done">완료</span>';
  if(t.status==='urgent')return '<span class="chip urgent">🔴 마감임박</span>';
  return '<span class="chip doing">🟡 진행중</span>';
}
function dotsOf(t){
  const total = ackTotal(t), done = ackDone(t);
  let h = '<span class="dots">';
  for(let i=0;i<total;i++) h += `<i class="${i<done?'f':''}"></i>`;
  return h + '</span>';
}

/* ================= 라우팅 ================= */
document.getElementById('nav').addEventListener('click', e => {
  const a = e.target.closest('a'); if(!a) return;
  e.preventDefault();
  document.querySelectorAll('#nav a').forEach(x=>x.classList.remove('on'));
  a.classList.add('on');
  cur.view = a.dataset.view; cur.filter = a.dataset.filter || null; cur.taskId = null;
  cur.mchap = null; cur.msec = null; cur.mq = '';
  $('#pageTitle').textContent = a.textContent.replace(/\d+$/,'').trim();
  document.getElementById('side').classList.remove('open');
  render();
});

function render(){
  const v = $('#view');
  if(cur.taskId)            v.innerHTML = viewDetail(cur.taskId);
  else if(cur.view==='tasks')  v.innerHTML = viewTasks();
  else if(cur.view==='manual') v.innerHTML = viewManual();
  else if(cur.view==='issues') v.innerHTML = viewIssues();
  else if(cur.view==='erp')    v.innerHTML = viewErp();
  else                         v.innerHTML = viewMembers();
  window.scrollTo(0,0);
  renderNoti();
}

/* ================= 업무 목록 ================= */
function filtered(){
  if(cur.filter==='mine')   return TASKS.filter(t=>t.mine);
  if(cur.filter==='shared') return TASKS.filter(t=>!t.mine && isTarget(t));
  if(cur.filter==='unread') return TASKS.filter(t=>isTarget(t) && !iAcked(t) && !t.mine);
  return TASKS;
}
function viewTasks(){
  const F = [
    {k:'today', l:'전체', n:TASKS.length},
    {k:'mine',  l:'내가 등록', n:TASKS.filter(t=>t.mine).length},
    {k:'shared',l:'나에게 공유', n:TASKS.filter(t=>!t.mine&&isTarget(t)).length},
    {k:'unread',l:'미확인', n:TASKS.filter(t=>isTarget(t)&&!iAcked(t)&&!t.mine).length}
  ];
  let h = '<div class="tabs">' + F.map(f =>
    `<button class="tab ${cur.filter===f.k?'on':''}" onclick="setFilter('${f.k}')">${f.l}<span class="n">${f.n}</span></button>`
  ).join('') + '</div>';

  const list = filtered();
  if(!list.length) return h + `<div class="empty"><div class="em">🎉</div><b>해당하는 업무가 없습니다</b><p>모두 확인하셨습니다.</p></div>`;

  h += list.map(t => {
    const un = unreadNames(t);
    const acked = iAcked(t);
    return `
    <div class="card">
      <div class="r1">${chipOf(t)}<span class="store">${esc(t.store)}</span><span class="cat">${esc(t.cat)}</span></div>
      <h3>${esc(t.title)}</h3>
      <div class="meta">
        <span>⏰ ${esc(t.due)}</span><span class="sep">·</span>
        <span>${t.audience==='all'?'전체 공유':'<span class="to-me">🔵 나에게 공유</span>'}</span>
        <span class="sep">·</span><span>등록 ${esc(t.author)}${t.mine?' (나)':''}</span>
      </div>
      <div class="ackrow">
        ${dotsOf(t)}
        <span class="ackn">확인 ${ackDone(t)}/${ackTotal(t)}</span>
        ${un.length ? `<span class="unread">미확인: ${un.slice(0,3).map(esc).join(', ')}${un.length>3?` 외 ${un.length-3}명`:''}</span>`
                    : '<span class="unread" style="color:var(--green);font-weight:600">전원 확인 완료 ✓</span>'}
        <span class="acts">
          ${t.mine ? '' : (acked
            ? `<button class="btn ok" disabled>확인함 ✓</button>`
            : `<button class="btn pri" onclick="doAck(${t.id})">확인함 ✓</button>`)}
          <button class="btn" onclick="openTask(${t.id})">상세 · 댓글 ${t.comments.length}</button>
        </span>
      </div>
    </div>`;
  }).join('');
  return h;
}
function setFilter(k){
  cur.filter = k; cur.taskId = null;
  document.querySelectorAll('#nav a').forEach(a=>{
    a.classList.toggle('on', a.dataset.filter===k);
  });
  render();
}

/* ================= 업무 상세 ================= */
function viewDetail(id){
  const t = TASKS.find(x=>x.id===id);
  const total = ackTotal(t), done = ackDone(t), pct = Math.round(done/total*100);
  const rows = t.targets.map(n=>{
    const a = t.acks.find(x=>x.n===n);
    return `<div class="prow">
      <span class="st">${a?'✅':'⭕'}</span>
      <span class="nm">${esc(n)}${n===ME?' (나)':''}</span>
      ${a ? `<span class="tm">${esc(a.t)} 확인</span>${a.note?`<span class="note">"${esc(a.note)}"</span>`:''}`
          : `<span class="tm" style="color:var(--orange);font-weight:600">미확인</span>
             <span class="rm"><button class="btn sm" onclick="remind('${esc(n)}')">🔔 리마인드</button></span>`}
    </div>`;
  }).join('');

  const cmts = t.comments.length ? t.comments.map(c=>`
    <div class="cmt">
      <span class="av">${esc(c.n[0])}</span>
      <div class="b"><b>${esc(c.n)}</b><time>${esc(c.t)}</time><p>${esc(c.b)}</p></div>
    </div>`).join('') : '<p style="color:var(--t3);font-size:13px;padding:10px 0">아직 댓글이 없습니다.</p>';

  return `
  <button class="back" onclick="cur.taskId=null;render()">← 목록으로</button>
  <div class="panel">
    <div class="r1">${chipOf(t)}<span class="store">${esc(t.store)}</span><span class="cat">${esc(t.cat)}</span></div>
    <h2>${esc(t.title)}</h2>
    <div class="meta">
      <span>⏰ ${esc(t.due)}</span><span class="sep">·</span>
      <span>${t.audience==='all'?'전체 공유':'선택 공유'}</span><span class="sep">·</span>
      <span>등록 ${esc(t.author)}</span><span class="sep">·</span><span>중요도 ${esc(t.pri)}</span>
    </div>
    <div class="desc">${esc(t.body)}</div>
    ${t.mine ? '' : (iAcked(t)
      ? `<button class="btn ok" disabled>확인함 ✓</button>`
      : `<button class="btn pri" onclick="doAck(${t.id})">확인함 ✓</button>`)}
  </div>

  <div class="panel">
    <h4>확인 진행률 &nbsp;<span style="color:var(--green)">${done}/${total} (${pct}%)</span></h4>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="plist">${rows}</div>
  </div>

  <div class="panel">
    <h4>💬 댓글 ${t.comments.length}</h4>
    ${cmts}
    <div class="cmtform">
      <input id="cmtIn" placeholder="댓글을 입력하세요 (단톡 대신 여기서 공론화)"
             onkeydown="if(event.key==='Enter')addCmt(${t.id})">
      <button class="btn pri" onclick="addCmt(${t.id})">등록</button>
    </div>
  </div>

  ${t.mine ? `<div class="panel" style="text-align:right">
    <button class="btn ok" onclick="doneTask(${t.id})">업무 완료 처리 ✓</button>
  </div>` : ''}`;
}
function openTask(id){ cur.taskId = id; render(); }

/* ================= 액션 ================= */
function doAck(id){
  const t = TASKS.find(x=>x.id===id);
  if(iAcked(t)) return;
  const now = new Date();
  t.acks.push({n:ME, t:`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`, note:''});
  NOTIS.unshift({em:'✅', b:ME, t:`님이 확인했습니다 — ${t.title}`, time:'방금', tid:id, isNew:false});
  toast(`확인 완료 — 등록자(${t.author})에게 알림이 갑니다`);
  bump(); render();
}
function addCmt(id){
  const t = TASKS.find(x=>x.id===id);
  const v = $('#cmtIn').value.trim(); if(!v) return;
  const now = new Date();
  t.comments.push({n:ME, t:`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`, b:v});
  toast('댓글 등록 — 관련 직원에게 알림 발송');
  render();
}
function remind(n){ toast(`${n}님에게 리마인드 푸시를 보냈습니다 🔔`); }
function doneTask(id){
  const t = TASKS.find(x=>x.id===id);
  t.status='done'; toast('업무 완료 처리 — 전체 공유됨');
  cur.taskId=null; render();
}
function bump(){
  const n = TASKS.filter(t=>isTarget(t)&&!iAcked(t)&&!t.mine).length;
  $('#navShared').textContent = n;
  $('#navShared').style.display = n ? '' : 'none';
}

/* ================= 등록 모달 ================= */
function openNew(){ $('#mask').classList.add('on'); }
function closeNew(){ $('#mask').classList.remove('on'); }
function togglePeople(){
  const sel = document.querySelector('input[name=aud]:checked').value === 'sel';
  $('#people').style.display = sel ? 'flex' : 'none';
}
function createTask(){
  const title = $('#fTitle').value.trim() || '제목 없는 업무';
  const aud = document.querySelector('input[name=aud]:checked').value;
  let targets;
  if(aud === 'all') targets = STAFF.filter(n=>n!==ME);
  else {
    targets = [...document.querySelectorAll('#people input:checked')].map(i=>i.value);
    if(!targets.length){ toast('공유할 직원을 1명 이상 선택해주세요'); return; }
  }
  TASKS.unshift({
    id: Date.now(), store: $('#fStore').value, cat: $('#fCat').value, title,
    body: $('#fBody').value.trim() || '(내용 없음)',
    author: ME, due: `${$('#fDate').value} ${$('#fTime').value}`,
    pri: document.querySelector('input[name=pri]:checked').value,
    status: 'doing', audience: aud === 'all' ? 'all' : 'sel', mine: true,
    acks: [], targets, comments: []
  });
  closeNew();
  $('#fTitle').value=''; $('#fBody').value='';
  toast(`등록 완료 — ${targets.length}명에게 푸시 알림 발송 🔔`);
  setFilter('today');
}

/* ================= 알림 ================= */
function toggleNoti(e){ e.stopPropagation(); $('#noti').classList.toggle('on'); }
document.addEventListener('click', e=>{
  if(!e.target.closest('#noti') && !e.target.closest('.bell')) $('#noti').classList.remove('on');
});
function renderNoti(){
  $('#notiList').innerHTML = NOTIS.map((n,i)=>`
    <div class="ni ${n.isNew?'new':''}" onclick="fromNoti(${i})">
      <span class="em">${n.em}</span>
      <div><b>${esc(n.b)}</b>${esc(n.t)}<time>${esc(n.time)}</time></div>
    </div>`).join('');
  const c = NOTIS.filter(n=>n.isNew).length;
  $('#notiCnt').textContent = c;
  $('#notiCnt').style.display = c ? '' : 'none';
}
function fromNoti(i){
  const n = NOTIS[i]; n.isNew = false;
  $('#noti').classList.remove('on');
  if(n.tid) openTask(n.tid); else render();
}

/* ================= 매뉴얼 ================= */
/* ===== 학습 진도 (브라우저에 저장 — 실제 앱에서는 계정별 서버 저장) ===== */
function lsGet(){ try{ return JSON.parse(localStorage.getItem('poson_manual')||'{}'); }catch(e){ return {}; } }
function lsSet(o){ try{ localStorage.setItem('poson_manual', JSON.stringify(o)); }catch(e){} }
function isRead(id){ return !!lsGet()[id]; }
function toggleRead(id){
  const o = lsGet();
  if(o[id]){ delete o[id]; toast('학습 완료를 해제했습니다'); }
  else { o[id] = 1; toast('학습 완료 ✓ 진도에 반영됐습니다'); }
  lsSet(o); render();
}
function secsOf(no){ return LESSONS[no] || []; }
function progOf(no){
  const s = secsOf(no);
  const done = s.filter(x=>isRead(x.id)).length;
  return {done, total:s.length, pct: s.length ? Math.round(done/s.length*100) : 0};
}
function progAll(){
  let d=0, t=0;
  for(const c of CHAPTERS){ const p = progOf(c.no); d += p.done; t += p.total; }
  return {d, t, pct: t ? Math.round(d/t*100) : 0};
}

/* ===== 매뉴얼 화면 ===== */
function viewManual(){
  if(cur.msec)  return manualSection();
  if(cur.mchap) return manualChapter();
  return manualHome();
}

function manualHome(){
  const p = progAll();
  const q = cur.mq.trim();

  if(q){
    const hits = [];
    for(const c of CHAPTERS) for(const s of secsOf(c.no))
      if((s.title + s.summary).includes(q)) hits.push({c, s});
    return manualSearchBar() + (hits.length
      ? hits.map(({c,s})=>`
        <button class="sec" onclick="openSec(${c.no},'${s.id}')">
          <span class="ck">${isRead(s.id)?'✅':'⬜'}</span>
          <span><span class="t">${esc(s.title)}</span>
            <span class="s">${c.no}. ${esc(c.t)} · ${esc(s.summary.slice(0,40))}…</span></span>
          <span class="go">›</span>
        </button>`).join('')
      : `<div class="empty"><div class="em">🔍</div><b>"${esc(q)}" 검색 결과가 없습니다</b>
         <p>아직 변환된 챕터는 7장·8장입니다.</p></div>`);
  }

  return `
  <div class="mprog">
    <div class="r"><b>TIPS 관리 프로그램 학습</b>
      <span class="pc">${p.d}/${p.t} 완료 (${p.pct}%)</span></div>
    <div class="bar"><i style="width:${p.pct}%"></i></div>
    <div style="font-size:12.5px;color:var(--t3)">
      PDF를 그대로 보는 게 아니라, 매뉴얼 내용을 따라하기 단계로 바꿔 담았습니다. 폰에서도 그대로 읽힙니다.
    </div>
  </div>
  ${manualSearchBar()}
  <div class="chaps">
    ${CHAPTERS.map(c=>{
      const pr = progOf(c.no), ready = pr.total > 0;
      return `
      <button class="chap ${ready&&pr.pct===100?'done':''}" onclick="${ready?`openChap(${c.no})`:`toast('이 챕터는 아직 변환 전입니다')`}">
        <div class="h"><span class="num">${c.no}</span><span class="t">${esc(c.t)}</span></div>
        <div class="s">${esc(c.sub)}</div>
        ${ready
          ? `<div class="b"><i style="width:${pr.pct}%"></i></div>
             <div class="f"><span>${pr.done}/${pr.total} 학습 완료</span></div>`
          : `<div class="f"><span class="soonx">변환 예정</span><span>원문 p.${c.p}~</span></div>`}
      </button>`;
    }).join('')}
  </div>`;
}
function manualSearchBar(){
  return `<div class="msearch"><span>🔍</span>
    <input id="mq" value="${esc(cur.mq)}" placeholder="기능 이름으로 찾기 (예: 재고, 폐기, 핸디)"
           oninput="cur.mq=this.value" onkeydown="if(event.key==='Enter')render()">
    ${cur.mq?`<button class="btn sm" onclick="cur.mq='';render()">지우기</button>`:''}
  </div>`;
}

function manualChapter(){
  const c = CHAPTERS.find(x=>x.no===cur.mchap);
  const pr = progOf(c.no);
  return `
  <button class="back" onclick="cur.mchap=null;render()">← 챕터 목록</button>
  <div class="mprog">
    <div class="r"><b>${c.no}. ${esc(c.t)}</b><span class="pc">${pr.done}/${pr.total} (${pr.pct}%)</span></div>
    <div class="bar"><i style="width:${pr.pct}%"></i></div>
    <div style="font-size:12.5px;color:var(--t3)">원문 매뉴얼 p.${c.p}~ · ${esc(c.sub)}</div>
  </div>
  ${secsOf(c.no).map(s=>`
    <button class="sec" onclick="openSec(${c.no},'${s.id}')">
      <span class="ck">${isRead(s.id)?'✅':'⬜'}</span>
      <span><span class="t">${s.no}) ${esc(s.title)}</span>
        <span class="s">${esc(s.summary.slice(0,52))}…</span></span>
      <span class="go">›</span>
    </button>`).join('')}`;
}

function manualSection(){
  const c = CHAPTERS.find(x=>x.no===cur.mchap);
  const list = secsOf(cur.mchap);
  const i = list.findIndex(x=>x.id===cur.msec);
  const s = list[i];
  const read = isRead(s.id);

  const steps = s.steps.map(st=>`
    <div class="step">
      <b>${esc(st.t)}</b>
      <p>${esc(st.d)}</p>
      ${st.mark?`<span class="mk">화면 표시 ${esc(st.mark)}</span>`:''}
      ${st.shot?`<div class="shot">🖼 원문 p.${s.page} 화면 캡처 — 실제 앱에서는 이 자리에 캡처가 들어갑니다</div>`:''}
    </div>`).join('');

  const table = s.table ? `
    <h4 style="font-size:13px;font-weight:700;color:var(--t2);margin:18px 0 9px">${esc(s.table.title)}</h4>
    <div class="tabwrap"><table class="ktab">
      <tr>${s.table.head.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>
      ${s.table.rows.map(r=>`<tr>${r.map(cd=>`<td>${esc(cd)}</td>`).join('')}</tr>`).join('')}
    </table></div>` : '';

  return `
  <button class="back" onclick="cur.msec=null;render()">← ${c.no}. ${esc(c.t)}</button>
  <div class="lead">
    <div class="k">${c.no}장 ${s.no}) · 원문 p.${s.page}</div>
    <h2 style="font-size:19px;font-weight:700;margin-bottom:8px">${esc(s.title)}</h2>
    <p>${esc(s.summary)}</p>
  </div>

  ${table}

  <h4 style="font-size:13px;font-weight:700;color:var(--t2);margin:0 0 9px">따라하기</h4>
  <div class="stepn">${steps}</div>

  ${(s.warn||[]).map(w=>`<div class="note w"><b>⚠️ 주의</b>${esc(w)}</div>`).join('')}
  ${s.tip?`<div class="note i"><b>💡 알아두기</b>${esc(s.tip)}</div>`:''}

  ${s.quiz?`
  <div class="quiz">
    <div class="q">❓ ${esc(s.quiz.q)}</div>
    <div class="ox">
      <button onclick="answer('${s.id}',true)">O</button>
      <button onclick="answer('${s.id}',false)">X</button>
    </div>
    <div id="qres_${s.id}"></div>
  </div>`:''}

  <div class="donebar">
    <button class="btn ${read?'ok':'pri'}" onclick="toggleRead('${s.id}')">
      ${read?'학습 완료 ✓ (해제하려면 클릭)':'학습 완료로 표시'}</button>
    <button class="btn" onclick="toast('업무 등록 화면에 이 항목이 첨부됩니다')">🔗 업무에 첨부</button>
  </div>

  <div class="donebar">
    ${i>0?`<button class="btn" onclick="openSec(${c.no},'${list[i-1].id}')">◀ ${esc(list[i-1].title)}</button>`:''}
    ${i<list.length-1?`<button class="btn" onclick="openSec(${c.no},'${list[i+1].id}')">${esc(list[i+1].title)} ▶</button>`:''}
  </div>`;
}

function openChap(no){ cur.mchap = no; cur.msec = null; render(); }
function openSec(no, id){ cur.mchap = no; cur.msec = id; render(); }
function answer(id, pick){
  const s = secsOf(cur.mchap).find(x=>x.id===id);
  const ok = pick === s.quiz.a;
  document.getElementById('qres_'+id).innerHTML =
    `<div class="res ${ok?'ok':'no'}">${ok?'⭕ 정답입니다.':'❌ 아닙니다.'} ${esc(s.quiz.why)}</div>`;
}
